# Production reverse proxy for the web app (nginx-unprivileged, port 8080).
# The CSP below MUST equal `CSP` in vite.config.ts (guarded by src/nginx.test.ts).
# Do not add add_header inside `location` blocks: it would drop these server-level headers.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # nginx is the only hop in front of the server (TRUST_PROXY=1): overwrite, never append.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /auth/ {
        proxy_pass http://server:8787;
    }

    location /ws {
        proxy_pass http://server:8787;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
