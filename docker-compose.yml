# Local development database for apps/server.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: opencollab
      POSTGRES_PASSWORD: opencollab
      POSTGRES_DB: opencollab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencollab -d opencollab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
